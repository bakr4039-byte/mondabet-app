name: mondabet
description: Mondabet GPS Attendance – Employee Mobile App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Biometric auth
  local_auth: ^2.3.0

  # GPS / geofencing
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Maps
  google_maps_flutter: ^2.9.0

  # File picker
  file_picker: ^8.1.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  firebase_messaging: ^15.1.3
  firebase_core: ^3.6.0

  # Charts
  fl_chart: ^0.69.0

  # Local cache (white-label config + offline)
  hive_flutter: ^1.1.0

  # i18n
  easy_localization: ^3.0.7

  # DI
  get_it: ^8.0.2
  injectable: ^2.4.4

  # Utils
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  flutter_gen_runner: ^5.7.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/translations/
