name: mondabet
description: Mondabet GPS Attendance – Employee Mobile App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.7

  # HTTP
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Biometric auth
  local_auth: ^2.3.0

  # GPS / geofencing
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Connectivity (offline check-in/check-out queue + auto-sync on reconnect)
  connectivity_plus: ^6.1.0

  # Maps
  google_maps_flutter: ^2.9.0

  # File picker
  file_picker: ^8.1.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  firebase_messaging: ^15.1.3
  firebase_core: ^3.6.0

  # Charts
  fl_chart: ^0.69.0

  # Local cache (white-label config + offline)
  hive_flutter: ^1.1.0

  # i18n
  easy_localization: ^3.0.7

  # DI
  get_it: ^8.0.2
  injectable: ^3.0.0

  # File open
  path_provider: ^2.1.4

  # Utils
  # freezed_annotation/freezed/json_annotation/json_serializable/injectable_generator
  # aren't actually used anywhere in lib/ yet (no @freezed classes, no @InjectableInit,
  # no generated .g.dart/.freezed.dart files exist - injectable's own @singleton
  # annotation on ApiClient is likewise never processed; DI is wired by hand in
  # core/di/injection.dart instead). Since nothing depends on their exact behavior,
  # they're bumped here to current major versions rather than left pinned to their
  # original ~2024 releases, which capped the analyzer package's version below what
  # current Flutter/current plugins (like geolocator_android) require - forcing an
  # awkward choice between an old Flutter pin (breaks newer plugins' Gradle setup)
  # and these old codegen packages (breaks pub's dependency resolution). Bumping the
  # unused side of that conflict removes the conflict entirely.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  injectable_generator: ^3.1.3
  flutter_gen_runner: ^5.7.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/translations/
