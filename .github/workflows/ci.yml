name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "20"
  FLUTTER_VERSION: "3.22.0"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/mondabet

jobs:
  # ─── .NET Backend ──────────────────────────────────────────────────────────
  dotnet-build-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Mondabet.sln

      - name: Build
        run: dotnet build Mondabet.sln --no-restore -c Release

      - name: Test
        run: dotnet test Mondabet.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/**/*.trx"

  # ─── Docker Build & Push (per service) ───────────────────────────────────
  docker-build:
    name: Docker Build & Push
    needs: dotnet-build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: attendance
            dir: Attendance
            api: Mondabet.Attendance.Api
          - service: leave
            dir: Leave
            api: Mondabet.Leave.Api
          - service: employee
            dir: Employee
            api: Mondabet.Employee.Api
          - service: workflow
            dir: Workflow
            api: Mondabet.Workflow.Api
          - service: clarification
            dir: Clarification
            api: Mondabet.Clarification.Api
          - service: notification
            dir: Notification
            api: Mondabet.Notification.Api
          - service: report
            dir: Report
            api: Mondabet.Report.Api
          - service: tenant
            dir: Tenant
            api: Mondabet.Tenant.Api
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: src/Services/${{ matrix.dir }}
          file: src/Services/${{ matrix.dir }}/${{ matrix.api }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  # ─── Helm Lint ────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0
      - name: Lint chart
        run: helm lint infra/helm/charts/mondabet-api

  # ─── Angular Customer Portal ──────────────────────────────────────────────
  customer-portal:
    name: Customer Portal Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/portals/customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/portals/customer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build -- --configuration production

  # ─── Angular Super-Admin Portal ───────────────────────────────────────────
  super-admin-portal:
    name: Super-Admin Portal Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/portals/super-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/portals/super-admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build -- --configuration production

  # ─── Flutter Mobile ───────────────────────────────────────────────────────
  flutter-build-test:
    name: Flutter Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK (release)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release --no-pub
