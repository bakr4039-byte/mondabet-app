name: Build mobile APK

# Builds the Flutter employee app into an installable Android APK on GitHub's own
# runners, which have full internet access - unlike the sandboxed environment this
# repo is normally developed in, which cannot reach pub.dev/Google's Maven repo/the
# Android SDK at all. This workflow is additive: it doesn't touch any existing code,
# it just gives the project a place where "flutter build apk" can actually run.
#
# The mobile/ project has no committed android/ folder yet, so this workflow
# generates it fresh on every run with `flutter create --platforms=android .`
# rather than requiring one to be committed - that keeps the repo Android/iOS-free
# until someone deliberately wants to customize native project files.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned instead of "channel: stable" (which floats to whatever Flutter
          # ships today). The very first real run of this workflow failed pub's
          # dependency resolver: freezed ^2.5.7 / injectable_generator ^2.6.2 (as
          # pinned in pubspec.yaml) only support analyzer <8.0.0, while the newest
          # stable Flutter pulls in a `test`/flutter_test combo that requires
          # analyzer >=8.0.0 - an unsatisfiable gap that has nothing to do with
          # this project's own code. 3.24.5 matches the Flutter/Dart generation
          # this pubspec.yaml was actually written and pinned against, so pub
          # resolves everything without needing to touch any app source or
          # bump any package to a breaking major version.
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Scaffold Android platform (mobile/android/ isn't committed yet)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mondabet --project-name mondabet .
          fi

      # geolocator_android (pulled in by geolocator ^13.0.1) keeps getting updated for new
      # Android APIs independently of any Flutter version, and its build.gradle expects a
      # compileSdkVersion to already be set on it - something the *older* Flutter 3.24.5
      # project template (pinned above, needed for the pub dependency conflict) never
      # configures for plugin subprojects. That combination is what produced "Cannot invoke
      # method substring() on null object / compileSdkVersion is not specified" for
      # :geolocator_android specifically. Rather than touch pubspec.yaml (downgrading
      # geolocator risks losing GPS/geofencing behavior this app depends on), this patches
      # the freshly generated android/build.gradle to set compileSdkVersion 34 on any plugin
      # subproject that doesn't already declare one - it only fills in what's genuinely
      # missing, so a plugin that already sets its own (possibly higher) value is untouched.
      - name: Ensure plugin subprojects have a compileSdkVersion
        # Written as individual `echo` lines rather than a heredoc: a heredoc's raw,
        # unindented body breaks YAML's block-scalar indentation rules for `run: |`
        # (this is exactly what made an earlier commit's workflow file invalid -
        # "you have an error in your yaml syntax" - since every line here has to stay
        # indented at least as much as this step's other lines for YAML to parse it).
        #
        # Skips the "app" subproject deliberately: Flutter's own template already
        # does `project.evaluationDependsOn(':app')` for every subproject, which
        # forces :app to fully evaluate very early - by the time this block's
        # afterEvaluate tried to attach to :app too, Gradle had already finished
        # evaluating it and threw "Cannot run Project.afterEvaluate(Closure) when
        # the project is already evaluated". :app also isn't the problem anyway
        # (it already gets compileSdkVersion via flutter.compileSdkVersion) - only
        # plugin subprojects like :geolocator_android need this filled in.
        run: |
          {
            echo ''
            echo 'subprojects { subproject ->'
            echo '    if (subproject.name != "app") {'
            echo '        afterEvaluate {'
            echo '            if (subproject.hasProperty("android")) {'
            echo '                try {'
            echo '                    if (subproject.android.compileSdkVersion == null) {'
            echo '                        subproject.android.compileSdkVersion = 34'
            echo '                    }'
            echo '                } catch (ignored) {}'
            echo '            }'
            echo '        }'
            echo '    }'
            echo '}'
          } >> android/build.gradle

      # Optional: only present once the user adds a GOOGLE_SERVICES_JSON repo secret
      # (base64-encoded contents of their Firebase Android app's google-services.json).
      # Without it, Firebase/FCM push notifications just stay inactive - main.dart's
      # Firebase.initializeApp() call is wrapped in a try/catch for exactly this case,
      # so the build and the app itself both still work, just without push notifications.
      - name: Inject Firebase config if provided
        # GitHub Actions doesn't allow the `secrets` context inside a step's `if:`
        # condition (only github/needs/vars/env/etc. are allowed there) - referencing
        # it there fails workflow validation entirely ("Unrecognized named-value:
        # 'secrets'") before the job ever runs. So the step always runs, and the
        # presence check happens in the shell instead, against an env var populated
        # from the secret (which IS a valid place to reference secrets).
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mondabet-app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
